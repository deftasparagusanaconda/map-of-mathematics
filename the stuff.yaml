  - name: Henri Poincaré
    link: https://en.wikipedia.org/wiki/Henri_Poincar%C3%A9
    desc: helped found topology and dynamical systems while contributing broadly across mathematics
  - name: Georg Cantor
    link: https://en.wikipedia.org/wiki/Georg_Cantor
    desc: created set theory and developed the mathematical study of infinity
  - name: Kurt Gödel
    link: https://en.wikipedia.org/wiki/Kurt_G%C3%B6del
    desc: established profound limits on formal axiomatic systems
  - name: Alan Turing
    link: https://en.wikipedia.org/wiki/Alan_Turing
