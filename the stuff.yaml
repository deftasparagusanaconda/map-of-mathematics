  - name: Archimedes
    link: https://en.wikipedia.org/wiki/Archimedes
    desc: developed influential results in geometry, mechanics and the method of exhaustion
  - name: Isaac Newton
    link: https://en.wikipedia.org/wiki/Isaac_Newton
    desc: co-developed calculus and applied mathematics to mechanics and gravitation
  - name: Leonhard Euler
    link: https://en.wikipedia.org/wiki/Leonhard_Euler
    desc: shaped large parts of analysis, number theory, graph theory and mathematical notation
  - name: Carl Friedrich Gauss
    link: https://en.wikipedia.org/wiki/Carl_Friedrich_Gauss
    desc: made foundational contributions across number theory, geometry, analysis and astronomy
  - name: Bernhard Riemann
    link: https://en.wikipedia.org/wiki/Bernhard_Riemann
    desc: reshaped geometry and analysis through manifolds, integration and complex functions
  - name: David Hilbert
    link: https://en.wikipedia.org/wiki/David_Hilbert
    desc: influenced algebra, geometry, analysis and the formal foundations of mathematics
  - name: Emmy Noether
    link: https://en.wikipedia.org/wiki/Emmy_Noether
