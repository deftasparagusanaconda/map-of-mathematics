  - name: Terence Tao
    link: https://en.wikipedia.org/wiki/Terence_Tao
    desc: contributes broadly across analysis, number theory, combinatorics and partial differential equations
  - name: Maryam Mirzakhani
    link: https://en.wikipedia.org/wiki/Maryam_Mirzakhani
    desc: advanced the geometry and dynamics of moduli spaces and became the first woman awarded a Fields Medal
  - name: John Conway
    link: https://en.wikipedia.org/wiki/John_Conway
    desc: created influential ideas across algebra, geometry, number theory and recreational mathematics
  - name: Srinivasa Ramanujan
    link: https://en.wikipedia.org/wiki/Srinivasa_Ramanujan
    desc: discovered striking formulas and identities in number theory and analysis
  - name: Évariste Galois
    link: https://en.wikipedia.org/wiki/%C3%89variste_Galois
    desc: connected polynomial equations with symmetry and founded Galois theory
  - name: Joseph Fourier
    link: https://en.wikipedia.org/wiki/Joseph_Fourier
    desc: developed Fourier analysis while studying heat flow
  - name: Augustin-Louis Cauchy
    link: https://en.wikipedia.org/wiki/Augustin-Louis_Cauchy
    desc: helped establish rigorous foundations for calculus and complex analysis
  - name: Pierre-Simon Laplace
    link: https://en.wikipedia.org/wiki/Pierre-Simon_Laplace
    desc: advanced probability, analysis and celestial mechanics
  - name: Benoit Mandelbrot
    link: https://en.wikipedia.org/wiki/Benoit_Mandelbrot
    desc: popularised fractal geometry and the study of rough self-similar structures
- theorems:
  - name: Pythagorean Theorem
    link: https://en.wikipedia.org/wiki/Pythagorean_theorem
    desc: relates the side lengths of a right triangle by a² + b² = c²
  - name: Fundamental Theorem of Calculus
    link: https://en.wikipedia.org/wiki/Fundamental_theorem_of_calculus
    desc: connects differentiation with integration
  - name: Fundamental Theorem of Algebra
    link: https://en.wikipedia.org/wiki/Fundamental_theorem_of_algebra
    desc: states that every nonconstant complex polynomial has a complex root
  - name: Intermediate Value Theorem
    link: https://en.wikipedia.org/wiki/Intermediate_value_theorem
    desc: states that a continuous function takes every value between two attained values
  - name: Mean Value Theorem
    link: https://en.wikipedia.org/wiki/Mean_value_theorem
    desc: guarantees a point where the instantaneous rate of change matches an average rate
  - name: Stokes' Theorem
    link: https://en.wikipedia.org/wiki/Stokes'_theorem
    desc: relates integration over a manifold to integration over its boundary
  - name: Green's Theorem
    link: https://en.wikipedia.org/wiki/Green's_theorem
    desc: relates a line integral around a plane region to a double integral over it
  - name: Gauss's Divergence Theorem
    link: https://en.wikipedia.org/wiki/Divergence_theorem
    desc: relates flux through a closed boundary to divergence inside it
  - name: Bayes' Theorem
    link: https://en.wikipedia.org/wiki/Bayes'_theorem
    desc: relates conditional probabilities by reversing which event is conditioned upon
  - name: Noether's Theorem
    link: https://en.wikipedia.org/wiki/Noether's_theorem
    desc: connects continuous symmetries of a physical system with conservation laws
  - name: Euler's Formula
    link: https://en.wikipedia.org/wiki/Euler's_formula
    desc: connects complex exponentials with sine and cosine
  - name: Euler Characteristic
    link: https://en.wikipedia.org/wiki/Euler_characteristic
    desc: assigns a topological invariant commonly computed from vertices, edges and faces
  - name: Chinese Remainder Theorem
    link: https://en.wikipedia.org/wiki/Chinese_remainder_theorem
    desc: solves compatible systems of congruences with coprime moduli
  - name: Hahn-Banach Theorem
    link: https://en.wikipedia.org/wiki/Hahn%E2%80%93Banach_theorem
    desc: extends bounded linear functionals while preserving their norm
  - name: Banach Fixed-Point Theorem
    link: https://en.wikipedia.org/wiki/Banach_fixed-point_theorem
    desc: guarantees a unique fixed point for a contraction on a complete metric space
  - name: Gödel's Incompleteness Theorems
    link: https://en.wikipedia.org/wiki/G%C3%B6del's_incompleteness_theorems
    desc: show that sufficiently expressive consistent formal systems cannot prove every arithmetic truth
  - name: Spectral Theorem
    link: https://en.wikipedia.org/wiki/Spectral_theorem
    desc: describes suitable linear operators through eigenvalues and orthogonal decompositions
  - name: Jordan Curve Theorem
    link: https://en.wikipedia.org/wiki/Jordan_curve_theorem
    desc: states that a simple closed plane curve separates the plane into an inside and outside
  - name: Cayley-Hamilton Theorem
    link: https://en.wikipedia.org/wiki/Cayley%E2%80%93Hamilton_theorem
    desc: states that every square matrix satisfies its own characteristic polynomial
  - name: Rank-Nullity Theorem
    link: https://en.wikipedia.org/wiki/Rank%E2%80%93nullity_theorem
    desc: relates the dimensions of a linear map's image, kernel and domain
  - name: Lagrange's Theorem
    link: https://en.wikipedia.org/wiki/Lagrange's_theorem_(group_theory)
    desc: states that the order of a subgroup divides the order of a finite group
  - name: Sylow Theorems
    link: https://en.wikipedia.org/wiki/Sylow_theorems
    desc: describe subgroups whose orders are maximal powers of a prime
  - name: Riesz Representation Theorem
    link: https://en.wikipedia.org/wiki/Riesz_representation_theorem
    desc: represents certain linear functionals or measures using concrete mathematical objects
  - name: Stone-Weierstrass Theorem
    link: https://en.wikipedia.org/wiki/Stone%E2%80%93Weierstrass_theorem
    desc: gives broad conditions under which function algebras approximate continuous functions
- problems:
  - name: Riemann Hypothesis
    link: https://en.wikipedia.org/wiki/Riemann_hypothesis
    desc: does every nontrivial zero of the zeta function have real part one half?
  - name: P versus NP
    link: https://en.wikipedia.org/wiki/P_versus_NP_problem
    desc: is every efficiently verifiable problem also efficiently solvable?
  - name: Goldbach's Conjecture
    link: https://en.wikipedia.org/wiki/Goldbach's_conjecture
    desc: is every even integer greater than two the sum of two primes?
  - name: Twin Prime Conjecture
    link: https://en.wikipedia.org/wiki/Twin_prime_conjecture
    desc: are there infinitely many pairs of primes that differ by two?
  - name: Collatz Conjecture
    link: https://en.wikipedia.org/wiki/Collatz_conjecture
    desc: does repeatedly applying a simple parity-based rule eventually reach one?
  - name: Birch and Swinnerton-Dyer Conjecture
    link: https://en.wikipedia.org/wiki/Birch_and_Swinnerton-Dyer_conjecture
    desc: relates rational points on an elliptic curve to the behaviour of its L-function
  - name: Hodge Conjecture
    link: https://en.wikipedia.org/wiki/Hodge_conjecture
    desc: which cohomology classes on projective varieties arise from algebraic cycles?
  - name: Navier-Stokes Existence
    link: https://en.wikipedia.org/wiki/Navier%E2%80%93Stokes_existence_and_smoothness
    desc: do smooth three-dimensional Navier–Stokes solutions always exist globally?
  - name: Yang-Mills Mass Gap
    link: https://en.wikipedia.org/wiki/Yang%E2%80%93Mills_existence_and_mass_gap
    desc: asks for a rigorous quantum Yang–Mills theory with a positive mass gap
  - name: abc Conjecture
    link: https://en.wikipedia.org/wiki/abc_conjecture
    desc: relates the additive equation a + b = c to the distinct prime factors involved
  - name: Four Colour Theorem
    link: https://en.wikipedia.org/wiki/Four_color_theorem
    desc: can every planar map be coloured with at most four colours?
  - name: Fermat's Last Theorem
    link: https://en.wikipedia.org/wiki/Fermat's_Last_Theorem
