  - name: John von Neumann
    link: https://en.wikipedia.org/wiki/John_von_Neumann
    desc: contributed widely to logic, analysis, quantum theory, computing and game theory
  - name: Paul Erdős
    link: https://en.wikipedia.org/wiki/Paul_Erd%C5%91s
    desc: produced an enormous collaborative body of work in combinatorics and number theory
  - name: Andrew Wiles
    link: https://en.wikipedia.org/wiki/Andrew_Wiles
