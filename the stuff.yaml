- symbols:
  - name: ∀
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%80%20mathematics
    desc: denotes that a statement holds for every element under consideration
  - name: ∃
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%83%20mathematics
    desc: denotes that at least one element satisfying a statement exists
  - name: ∈
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%88%20mathematics
    desc: denotes membership of an element in a set
  - name: ∉
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%89%20mathematics
    desc: denotes that an element is not a member of a set
  - name: ⊂
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%8A%82%20mathematics
    desc: usually denotes a proper subset, though conventions vary
  - name: ⊆
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%8A%86%20mathematics
    desc: denotes a subset that may equal the containing set
  - name: ∅
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%85%20mathematics
    desc: denotes the set containing no elements
  - name: ℕ
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%84%95%20mathematics
    desc: usually denotes the natural numbers, with conventions differing over whether zero is included
  - name: ℤ
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%84%A4%20mathematics
    desc: denotes the set of integers
  - name: ℚ
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%84%9A%20mathematics
    desc: denotes the set of rational numbers
  - name: ℝ
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%84%9D%20mathematics
    desc: denotes the set of real numbers
  - name: ℂ
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%84%82%20mathematics
    desc: denotes the set of complex numbers
  - name: ⇒
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%87%92%20mathematics
    desc: denotes logical implication
  - name: ⇔
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%87%94%20mathematics
    desc: denotes logical equivalence or if and only if
  - name: ≅
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%89%85%20mathematics
    desc: often denotes an isomorphism or geometric congruence
  - name: ≃
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%89%83%20mathematics
    desc: often denotes an equivalence whose precise meaning depends on context
  - name: ≈
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%89%88%20mathematics
    desc: denotes approximate equality
  - name: ≡
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%89%A1%20mathematics
    desc: often denotes identity, congruence or definitional equality depending on context
  - name: ∘
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%98%20mathematics
    desc: usually denotes function composition
  - name: ⊗
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%8A%97%20mathematics
    desc: usually denotes a tensor product or another monoidal product
  - name: ⊕
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%8A%95%20mathematics
    desc: usually denotes a direct sum or another additive operation
  - name: ∑
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%91%20mathematics
    desc: denotes a sum indexed over specified values
  - name: ∏
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%8F%20mathematics
    desc: denotes a product indexed over specified values
  - name: ∫
    link: https://en.wikipedia.org/wiki/Special:Search?search=%E2%88%AB%20mathematics
    desc: denotes integration over a domain
- persons:
  - name: Euclid
